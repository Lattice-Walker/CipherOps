<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 49 800 330" role="img" aria-labelledby="t d">
<style>
 text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
 .tn{font-size:13.5px;font-weight:600;letter-spacing:.4px}
 .col{font-size:12px}
 .kk{font-size:10.5px;font-weight:600;fill-opacity:.85}
 .cd{font-size:12px;font-weight:600}
 .cp{font-size:12px;fill-opacity:.9}
 .sg{fill:#87A878}.lv{fill:#B8A9C9}
</style>

<g stroke-width="2">
  <rect x="20"  y="70" width="180" height="108" rx="8" fill="#87A878" fill-opacity=".12" stroke="#87A878"/>
