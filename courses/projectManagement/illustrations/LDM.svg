<line x1="200" y1="112" x2="290" y2="190" stroke="#87A878" stroke-width="2"/>
<text class="cd sg" x="208" y="108">1</text><text class="cd sg" x="278" y="188">n</text>

<line x1="385" y1="204" x2="385" y2="250" stroke="#B8A9C9" stroke-width="2"/>
