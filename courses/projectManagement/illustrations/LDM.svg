  <rect x="600" y="70" width="180" height="108" rx="8" fill="#87A878" fill-opacity=".12" stroke="#87A878"/>
  <line x1="600" y1="100" x2="780" y2="100" stroke="#87A878"/>
  <rect x="290" y="250" width="190" height="108" rx="8" fill="#B8A9C9" fill-opacity=".16" stroke="#B8A9C9"/>
