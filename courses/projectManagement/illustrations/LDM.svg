  <text x="304" y="170">status</text>
  <text x="304" y="194">customer_id</text><text x="466" y="194" text-anchor="end" class="kk">FK</text>

  <text x="614" y="122">product_id</text><text x="766" y="122" text-anchor="end" class="kk">PK</text>
