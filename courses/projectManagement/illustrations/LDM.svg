</g>

<g class="tn sg" text-anchor="middle"><text x="110" y="91">customer</text><text x="385" y="91">order</text><text x="690" y="91">product</text></g>
<text class="tn lv" x="385" y="271" text-anchor="middle">order_line</text>

<g class="col sg">
  <text x="34" y="122">customer_id</text><text x="186" y="122" text-anchor="end" class="kk">PK</text>
  <text x="34" y="146">name</text>
