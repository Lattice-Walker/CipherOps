<svg xmlns="http://www.w3.org/2000/svg" width="742" height="354" viewBox="39 25 742 354" role="img" aria-labelledby="t d">
<defs>
 <marker id="as" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#87A878"/></marker>
</defs>
<style>
 text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
 .sn{font-size:14.5px;font-weight:600}
 .ph{font-size:15px;font-weight:600}
 .it{font-size:12.5px}
 .id{font-size:11px;fill-opacity:.85}
 .lb{font-size:12px;fill-opacity:.9}
 .cp{font-size:12px;fill-opacity:.9}
 .sg{fill:#87A878}.lv{fill:#B8A9C9}
</style>

<g stroke-width="2">
  <rect x="60"  y="46" width="190" height="58" rx="10" fill="#87A878" fill-opacity=".16" stroke="#87A878"/>
  <rect x="315" y="46" width="190" height="58" rx="10" fill="#87A878" fill-opacity=".16" stroke="#87A878"/>
  <rect x="570" y="46" width="190" height="58" rx="10" fill="#87A878" fill-opacity=".16" stroke="#87A878"/>
</g>
<g class="sn sg" text-anchor="middle">
  <text x="155" y="81">Set objectives</text><text x="410" y="81">Monitor results</text><text x="665" y="81">Give feedback</text>
</g>
<g stroke="#87A878" stroke-width="2" marker-end="url(#as)">
  <line x1="252" y1="75" x2="309" y2="75"/>
  <line x1="507" y1="75" x2="564" y2="75"/>
</g>
<path d="M665 106 L665 140 L155 140 L155 110" fill="none" stroke="#87A878" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#as)"/>
<text class="lb sg" x="410" y="134" text-anchor="middle">the cycle repeats rather than closing</text>

<text class="ph sg" x="62" y="218">Individual level</text>
<g class="it sg">
  <text x="62" y="252">Periodic appraisals</text>
  <text x="62" y="290">SMART objectives</text>
  <text x="62" y="328">Skills assessment</text>
</g>
<g class="id sg">
  <text x="62" y="270">a scheduled review of the past period</text>
  <text x="62" y="308">specific, measurable, achievable, relevant, timed</text>
  <text x="62" y="346">what the person can do, against what the role needs</text>
</g>

<text class="ph lv" x="452" y="218">Collective level</text>
<g class="it lv">
  <text x="452" y="252">Coordination mechanisms</text>
  <text x="452" y="290">Distribution of responsibilities</text>
  <text x="452" y="328">Shared indicators</text>
</g>
<g class="id lv">
  <text x="452" y="270">how the team's work is sequenced and handed over</text>
  <text x="452" y="308">who owns what, and where the gaps are</text>
  <text x="452" y="346">completion rate, quality measures, team cohesion</text>
</g>
</svg>
