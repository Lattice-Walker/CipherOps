</g>

<line x1="110" y1="442" x2="470" y2="442" stroke="#87A878" stroke-width="1.6" marker-end="url(#as)"/>
<text class="ae sg" x="110" y="462">low</text>
<text class="ae sg" x="470" y="462" text-anchor="end">high</text>
<text class="ax sg" x="290" y="486" text-anchor="middle">Cooperativeness : concern for the other party's interests</text>

<line x1="94" y1="430" x2="94" y2="70" stroke="#87A878" stroke-width="1.6" marker-end="url(#as)"/>
<text class="ae sg" x="84" y="84" text-anchor="end">high</text>
<text class="ae sg" x="84" y="424" text-anchor="end">low</text>
<text class="ax sg" x="42" y="250" text-anchor="middle" transform="rotate(-90 42 250)">Assertiveness : concern for one's own interests</text>
