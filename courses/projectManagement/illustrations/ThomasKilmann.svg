</style>

<rect x="110" y="70" width="360" height="360" rx="8" fill="#87A878" fill-opacity=".05" stroke="#87A878" stroke-width="1.4" stroke-dasharray="6 6"/>

<g stroke-width="2">
  <rect x="118" y="84"  width="150" height="52" rx="9" fill="#87A878" fill-opacity=".20" stroke="#87A878"/>
  <rect x="312" y="84"  width="150" height="52" rx="9" fill="#B8A9C9" fill-opacity=".20" stroke="#B8A9C9"/>
  <rect x="215" y="224" width="150" height="52" rx="9" fill="#87A878" fill-opacity=".20" stroke="#87A878"/>
  <rect x="118" y="364" width="150" height="52" rx="9" fill="#B8A9C9" fill-opacity=".20" stroke="#B8A9C9"/>
  <rect x="312" y="364" width="150" height="52" rx="9" fill="#87A878" fill-opacity=".20" stroke="#87A878"/>
</g>
<g class="mn" text-anchor="middle">
  <text class="sg" x="193" y="116">Competing</text>
  <text class="lv" x="387" y="116">Collaborating</text>
  <text class="sg" x="290" y="256">Compromising</text>
  <text class="lv" x="193" y="396">Avoiding</text>
