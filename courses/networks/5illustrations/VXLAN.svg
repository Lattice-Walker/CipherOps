<svg xmlns="http://www.w3.org/2000/svg" width="854" height="383" viewBox="3 18 854 383" role="img" aria-labelledby="t d">
<defs>
 <marker id="as" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#87A878"/></marker>
 <marker id="al" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B8A9C9"/></marker>
</defs>
<style>
 text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
 .hd{font-size:14px;font-weight:600}
 .sb{font-size:11.5px;fill-opacity:.9}
 .tl{font-size:13px;font-weight:600}
 .fx{font-size:12.5px}
 .fs{font-size:11px;fill-opacity:.9}
 .cap{font-size:12px;fill-opacity:.9}
 .sg{fill:#87A878}.lv{fill:#B8A9C9}
</style>

<path d="M262 182 C300 96 560 96 598 182" fill="none" stroke="#B8A9C9" stroke-width="2.4" stroke-dasharray="9 6"/>
<text class="tl lv" x="430" y="62" text-anchor="middle">Overlay: one VXLAN segment, VNI 10100</text>
<text class="sb lv" x="430" y="82" text-anchor="middle">a 24-bit identifier gives roughly 16 million segments, against 4094 for an 802.1Q VLAN</text>

<rect x="180" y="158" width="500" height="112" rx="14" fill="#87A878" fill-opacity=".07" stroke="#87A878" stroke-width="2" stroke-dasharray="8 5"/>
<text class="sb sg" x="430" y="260" text-anchor="middle">Underlay: a routed IP network only ever sees ordinary UDP traffic</text>

<rect x="200" y="176" width="124" height="62" rx="9" fill="#87A878" fill-opacity=".18" stroke="#87A878" stroke-width="2"/>
<text class="hd sg" x="262" y="202" text-anchor="middle">VTEP 1</text>
<text class="sb sg" x="262" y="222" text-anchor="middle">10.0.0.1</text>

<rect x="536" y="176" width="124" height="62" rx="9" fill="#87A878" fill-opacity=".18" stroke="#87A878" stroke-width="2"/>
<text class="hd sg" x="598" y="202" text-anchor="middle">VTEP 2</text>
<text class="sb sg" x="598" y="222" text-anchor="middle">10.0.0.2</text>

<line x1="330" y1="207" x2="530" y2="207" stroke="#87A878" stroke-width="2" marker-end="url(#as)"/>
<text class="fs sg" x="430" y="199" text-anchor="middle">encapsulated UDP, port 4789</text>

<rect x="24" y="176" width="130" height="62" rx="9" fill="#B8A9C9" fill-opacity=".14" stroke="#B8A9C9" stroke-width="2"/>
<text class="hd lv" x="89" y="202" text-anchor="middle">VM A</text>
<text class="sb lv" x="89" y="222" text-anchor="middle">tenant 1</text>
<line x1="156" y1="207" x2="196" y2="207" stroke="#B8A9C9" stroke-width="2" marker-end="url(#al)"/>

<rect x="706" y="176" width="130" height="62" rx="9" fill="#B8A9C9" fill-opacity=".14" stroke="#B8A9C9" stroke-width="2"/>
<text class="hd lv" x="771" y="202" text-anchor="middle">VM B</text>
<text class="sb lv" x="771" y="222" text-anchor="middle">tenant 1</text>
<line x1="664" y1="207" x2="702" y2="207" stroke="#B8A9C9" stroke-width="2" marker-end="url(#al)"/>

<text class="tl sg" x="30" y="316">Encapsulation, about 50 bytes of overhead per frame</text>
<g stroke-width="1.8">
  <rect x="30" y="328" width="118" height="52" rx="6" fill="#B8A9C9" fill-opacity=".16" stroke="#B8A9C9"/>
  <rect x="154" y="328" width="106" height="52" rx="6" fill="#B8A9C9" fill-opacity=".16" stroke="#B8A9C9"/>
  <rect x="266" y="328" width="126" height="52" rx="6" fill="#B8A9C9" fill-opacity=".16" stroke="#B8A9C9"/>
  <rect x="398" y="328" width="158" height="52" rx="6" fill="#B8A9C9" fill-opacity=".26" stroke="#B8A9C9"/>
  <rect x="562" y="328" width="268" height="52" rx="6" fill="#87A878" fill-opacity=".22" stroke="#87A878"/>
</g>
<text class="fx lv" x="89"  y="352" text-anchor="middle">Outer Ethernet</text>
<text class="fx lv" x="207" y="352" text-anchor="middle">Outer IP</text>
<text class="fx lv" x="329" y="352" text-anchor="middle">UDP</text>
<text class="fs lv" x="329" y="369" text-anchor="middle">dst 4789</text>
<text class="fx lv" x="477" y="352" text-anchor="middle">VXLAN header</text>
<text class="fs lv" x="477" y="369" text-anchor="middle">24-bit VNI</text>
<text class="fx sg" x="696" y="352" text-anchor="middle">Original Ethernet frame</text>
<text class="fs sg" x="696" y="369" text-anchor="middle">carried unchanged</text>
</svg>
