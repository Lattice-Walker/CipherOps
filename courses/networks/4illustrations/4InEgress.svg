<svg xmlns="http://www.w3.org/2000/svg" width="840" height="393" viewBox="0 0 840 393" role="img" aria-labelledby="t d">
<defs>
 <marker id="as" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#87A878"/></marker>
 <marker id="al" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B8A9C9"/></marker>
</defs>
<style>
 text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
 .pt{font-size:15px;font-weight:600}
 .bx{font-size:13.5px;font-weight:600}
 .bs{font-size:11.5px;fill-opacity:.9}
 .pk{font-size:12px;font-family:ui-monospace,'DejaVu Sans Mono',Consolas,monospace}
 .vd{font-size:11.5px}
 .sg{fill:#87A878}.lv{fill:#B8A9C9}
</style>

<text class="pt sg" x="20" y="28">Egress filtering </text>
<g>
  <rect x="20" y="48" width="152" height="112" rx="10" fill="#87A878" fill-opacity=".12" stroke="#87A878" stroke-width="2"/>
  <text class="bx sg" x="96" y="94" text-anchor="middle">Internal network</text>
  <text class="bs sg" x="96" y="114" text-anchor="middle">203.0.113.0/24</text>

  <rect x="332" y="42" width="140" height="124" rx="10" fill="none" stroke="#B8A9C9" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="bx lv" x="402" y="98" text-anchor="middle">Egress filter</text>
  <text class="bs lv" x="402" y="117" text-anchor="middle">source must be ours</text>

  <rect x="696" y="48" width="124" height="112" rx="10" fill="#B8A9C9" fill-opacity=".12" stroke="#B8A9C9" stroke-width="2"/>
  <text class="bx lv" x="758" y="108" text-anchor="middle">Internet</text>

  <text class="pk sg" x="252" y="70" text-anchor="middle">src 203.0.113.9</text>
  <line x1="176" y1="80" x2="326" y2="80" stroke="#87A878" stroke-width="2" marker-end="url(#as)"/>
  <line x1="476" y1="80" x2="690" y2="80" stroke="#87A878" stroke-width="2" marker-end="url(#as)"/>
  <path d="M500 74 l7 7 l12 -14" fill="none" stroke="#87A878" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="vd sg" x="590" y="70" text-anchor="middle">forwarded</text>

  <text class="pk lv" x="252" y="132" text-anchor="middle">src 198.51.100.4</text>
  <line x1="176" y1="142" x2="326" y2="142" stroke="#B8A9C9" stroke-width="2" marker-end="url(#al)"/>
  <g stroke="#B8A9C9" stroke-width="2.6" stroke-linecap="round">
    <line x1="494" y1="134" x2="510" y2="150"/><line x1="510" y1="134" x2="494" y2="150"/>
  </g>
  <text class="vd lv" x="526" y="141">dropped: the source is not</text><text class="vd lv" x="526" y="157">in our address space</text>
</g>


<text class="pt lv" x="20" y="234">Ingress filtering </text>
<g>
  <rect x="20" y="254" width="152" height="112" rx="10" fill="#B8A9C9" fill-opacity=".12" stroke="#B8A9C9" stroke-width="2"/>
  <text class="bx lv" x="96" y="314" text-anchor="middle">Internet</text>

  <rect x="332" y="248" width="140" height="124" rx="10" fill="none" stroke="#B8A9C9" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="bx lv" x="402" y="304" text-anchor="middle">Ingress filter</text>
  <text class="bs lv" x="402" y="323" text-anchor="middle">source must not be ours</text>

  <rect x="696" y="254" width="124" height="112" rx="10" fill="#87A878" fill-opacity=".12" stroke="#87A878" stroke-width="2"/>
  <text class="bx sg" x="758" y="300" text-anchor="middle">Internal net</text>
  <text class="bs sg" x="758" y="320" text-anchor="middle">203.0.113.0/24</text>

  <text class="pk sg" x="252" y="276" text-anchor="middle">src 198.51.100.4</text>
  <line x1="176" y1="286" x2="326" y2="286" stroke="#87A878" stroke-width="2" marker-end="url(#as)"/>
  <line x1="476" y1="286" x2="690" y2="286" stroke="#87A878" stroke-width="2" marker-end="url(#as)"/>
  <path d="M500 280 l7 7 l12 -14" fill="none" stroke="#87A878" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="vd sg" x="590" y="276" text-anchor="middle">forwarded</text>

  <text class="pk lv" x="252" y="338" text-anchor="middle">src 203.0.113.9</text>
  <line x1="176" y1="348" x2="326" y2="348" stroke="#B8A9C9" stroke-width="2" marker-end="url(#al)"/>
  <g stroke="#B8A9C9" stroke-width="2.6" stroke-linecap="round">
    <line x1="494" y1="340" x2="510" y2="356"/><line x1="510" y1="340" x2="494" y2="356"/>
  </g>
  <text class="vd lv" x="526" y="347">dropped: an internal address</text><text class="vd lv" x="526" y="363">cannot arrive from outside</text>
</g>

</svg>
