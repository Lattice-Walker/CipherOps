<svg xmlns="http://www.w3.org/2000/svg" width="782" height="407" viewBox="9 33 782 407" role="img" aria-labelledby="t d">
<defs>
 <marker id="as" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#87A878"/></marker>
 <marker id="al" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B8A9C9"/></marker>
</defs>
<style>
 text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
 .card{fill-opacity:.10;stroke-width:2}
 .h{font-size:17px;font-weight:600}
 .sub{font-size:12.5px;font-style:italic;fill-opacity:.9}
 .it{font-size:12.5px}
 .gate{font-size:15px;font-weight:600}
 .note{font-size:12.5px;fill-opacity:.9}
 .sg{fill:#87A878}.lv{fill:#B8A9C9}
</style>

<g>
  <rect class="card" x="30" y="54" width="220" height="140" rx="12" fill="#87A878" stroke="#87A878"/>
  <text class="h sg" x="140" y="100" text-anchor="middle">Knowledge</text>
 
  <text class="it sg" x="140" y="146" text-anchor="middle">Password</text>
  <text class="it sg" x="140" y="166" text-anchor="middle">PIN, passphrase</text>

  <rect class="card" x="290" y="54" width="220" height="140" rx="12" fill="#B8A9C9" stroke="#B8A9C9"/>
  <text class="h lv" x="400" y="100" text-anchor="middle">Possession</text>

  <text class="it lv" x="400" y="146" text-anchor="middle">Hardware token, smart card</text>
  <text class="it lv" x="400" y="166" text-anchor="middle">Authenticator application</text>

  <rect class="card" x="550" y="54" width="220" height="140" rx="12" fill="#87A878" stroke="#87A878"/>
  <text class="h sg" x="660" y="100" text-anchor="middle">Inherence</text>

  <text class="it sg" x="660" y="146" text-anchor="middle">Fingerprint, face</text>
  <text class="it sg" x="660" y="166" text-anchor="middle">Other biometric traits</text>
</g>

<g fill="none" stroke-width="2">
  <path d="M140 198 C140 232 260 226 322 284" stroke="#87A878" marker-end="url(#as)"/>
  <path d="M400 198 L400 282" stroke="#B8A9C9" marker-end="url(#al)"/>
  <path d="M660 198 C660 232 540 226 478 284" stroke="#87A878" marker-end="url(#as)"/>
</g>

<rect x="230" y="290" width="340" height="56" rx="10" fill="#B8A9C9" fill-opacity=".14" stroke="#B8A9C9" stroke-width="2"/>
<text class="gate lv" x="400" y="316" text-anchor="middle">At least two factors,</text>
<text class="gate lv" x="400" y="336" text-anchor="middle">from different categories</text>

<line x1="400" y1="346" x2="400" y2="378" stroke="#87A878" stroke-width="2" marker-end="url(#as)"/>
<rect x="305" y="384" width="190" height="44" rx="22" fill="#87A878" fill-opacity=".18" stroke="#87A878" stroke-width="2"/>
<text class="gate sg" x="400" y="412" text-anchor="middle">Access granted</text>
</svg>
