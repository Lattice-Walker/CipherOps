 .el{font-size:12px;fill:#87A878}
 .elh{font-size:12px;fill:#B8A9C9}
 .note{font-size:12.5px;fill:#B8A9C9}
 .nt{font-size:13px;font-weight:600;fill:#B8A9C9}
</style>
<text class="nh" x="20" y="28">IPv4 : 32 bits, four 8-bit octets</text>
<g>
  <rect class="host" x="20" y="42" width="200" height="76" rx="7"/>
  <rect class="host" x="230" y="42" width="200" height="76" rx="7"/>
  <rect class="host" x="440" y="42" width="200" height="76" rx="7"/>
  <rect class="host" x="650" y="42" width="200" height="76" rx="7"/>
</g>
<g text-anchor="middle">
  <text class="note" x="120" y="63" fill-opacity=".75">Octet 1</text>
  <text class="nh" x="120" y="86">192</text>
  <text class="note" x="120" y="107" font-family="ui-monospace,'DejaVu Sans Mono',monospace">11000000</text>
  <text class="note" x="330" y="63" fill-opacity=".75">Octet 2</text>
  <text class="nh" x="330" y="86">168</text>
  <text class="note" x="330" y="107" font-family="ui-monospace,'DejaVu Sans Mono',monospace">10101000</text>
  <text class="note" x="550" y="63" fill-opacity=".75">Octet 3</text>
