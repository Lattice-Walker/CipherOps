  <text class="note" x="550" y="107" font-family="ui-monospace,'DejaVu Sans Mono',monospace">00000001</text>
  <text class="note" x="760" y="63" fill-opacity=".75">Octet 4</text>
  <text class="nh" x="760" y="86">1</text>
  <text class="note" x="760" y="107" font-family="ui-monospace,'DejaVu Sans Mono',monospace">00000001</text>
</g>
