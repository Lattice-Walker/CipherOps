<svg xmlns="http://www.w3.org/2000/svg" width="860" height="289" viewBox="0 0 860 289" role="img" aria-labelledby="t d">
<defs>
 <marker id="as" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#87A878"/></marker>
 <marker id="al" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B8A9C9"/></marker>
</defs>
<style>
 text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
 .dev{fill:#87A878;fill-opacity:.18;stroke:#87A878;stroke-width:2}
 .host{fill:#B8A9C9;fill-opacity:.18;stroke:#B8A9C9;stroke-width:2}
 .dim{fill:#B8A9C9;fill-opacity:.07;stroke:#B8A9C9;stroke-width:2;stroke-dasharray:7 5}
 .ext{fill:#B8A9C9;fill-opacity:.07;stroke:#B8A9C9;stroke-width:2;stroke-dasharray:7 5}
 .chip{fill:#87A878;fill-opacity:.12;stroke:none}
 .chipl{fill:#B8A9C9;fill-opacity:.12;stroke:none}
 .nd{font-size:16px;font-weight:600;fill:#87A878}
 .nh{font-size:16px;font-weight:600;fill:#B8A9C9}
 .el{font-size:12px;fill:#87A878}
 .elh{font-size:12px;fill:#B8A9C9}
 .note{font-size:12.5px;fill:#B8A9C9}
 .nt{font-size:13px;font-weight:600;fill:#B8A9C9}
</style>
<text class="nd" x="20" y="30" font-size="15">192.168.1.0/24, where the prefix cuts the address</text>
<g>
  <rect class="dev" x="20" y="46" width="190" height="66" rx="7"/>
  <rect class="dev" x="218" y="46" width="190" height="66" rx="7"/>
  <rect class="dev" x="416" y="46" width="190" height="66" rx="7"/>
  <rect class="host" x="626" y="46" width="190" height="66" rx="7"/>
</g>
<g text-anchor="middle">
  <text class="nd" x="115" y="74" font-size="17">192</text>
  <text class="el" x="115" y="98" font-family="ui-monospace,'DejaVu Sans Mono',monospace">11000000</text>
  <text class="nd" x="313" y="74" font-size="17">168</text>
  <text class="el" x="313" y="98" font-family="ui-monospace,'DejaVu Sans Mono',monospace">10101000</text>
  <text class="nd" x="511" y="74" font-size="17">1</text>
  <text class="el" x="511" y="98" font-family="ui-monospace,'DejaVu Sans Mono',monospace">00000001</text>
  <text class="nh" x="721" y="74" font-size="17">0</text>
  <text class="elh" x="721" y="98" font-family="ui-monospace,'DejaVu Sans Mono',monospace">00000000</text>
</g>
<g stroke-width="2" fill="none">
  <path d="M20 124 L20 136 L606 136 L606 124" stroke="#87A878"/>
  <path d="M626 124 L626 136 L816 136 L816 124" stroke="#B8A9C9"/>
</g>
<text class="nd" x="313" y="158" text-anchor="middle" font-size="14">network portion, 24 bits</text>
<text class="nh" x="721" y="158" text-anchor="middle" font-size="14">host portion, 8 bits</text>

<text class="nh" x="20" y="206" font-size="15">Moving the prefix trades subnets against hosts</text>
<g>
  <rect class="dim" x="20" y="222" width="256" height="46" rx="7"/>
  <rect class="dim" x="302" y="222" width="256" height="46" rx="7"/>
  <rect class="dim" x="584" y="222" width="256" height="46" rx="7"/>
</g>
<g text-anchor="middle">
  <text class="nt" x="148" y="242">/24</text><text class="note" x="148" y="260" fill-opacity=".9">1 subnet, 254 usable hosts</text>
  <text class="nt" x="430" y="242">/25</text><text class="note" x="430" y="260" fill-opacity=".9">2 subnets, 126 usable hosts</text>
  <text class="nt" x="712" y="242">/26</text><text class="note" x="712" y="260" fill-opacity=".9">4 subnets, 62 usable hosts</text>
</g>
<g stroke="#B8A9C9" stroke-width="2" marker-end="url(#al)">
  <line x1="278" y1="245" x2="296" y2="245"/><line x1="560" y1="245" x2="578" y2="245"/>
</g>

</svg>
