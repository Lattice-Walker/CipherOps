<text class="cp lv" x="796" y="240">bases</text>
<text class="cp lv" x="796" y="256">differ:</text>
<text class="cp lv" x="796" y="272">discard</text>

<line x1="115" y1="348" x2="745" y2="348" stroke="#87A878" stroke-width="2" marker-start="url(#asr)" marker-end="url(#as)"/>
<text class="lb sg" x="430" y="340" text-anchor="middle">classical channel</text>
<text class="cp sg" x="430" y="370" text-anchor="middle">bases compared (sifting) → error rate estimated → privacy amplification applied</text>

