<rect x="24" y="42" width="182" height="96" rx="11" fill="#87A878" fill-opacity=".14" stroke="#87A878" stroke-width="2"/>
<text class="hd sg" x="115" y="72" text-anchor="middle">Alice</text>
<text class="sb sg" x="115" y="94" text-anchor="middle">picks a random bit and</text>
<text class="sb sg" x="115" y="112" text-anchor="middle">a random basis for each</text>
<text class="sb sg" x="115" y="130" text-anchor="middle">photon she sends</text>

<rect x="654" y="42" width="182" height="96" rx="11" fill="#87A878" fill-opacity=".14" stroke="#87A878" stroke-width="2"/>
<text class="hd sg" x="745" y="72" text-anchor="middle">Bob</text>
<text class="sb sg" x="745" y="94" text-anchor="middle">picks a random basis</text>
<text class="sb sg" x="745" y="112" text-anchor="middle">for each arriving photon,</text>
<text class="sb sg" x="745" y="130" text-anchor="middle">independently of Alice</text>

