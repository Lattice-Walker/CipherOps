<svg xmlns="http://www.w3.org/2000/svg" width="854" height="438" viewBox="3 21 854 438" role="img" aria-labelledby="t d">
<defs>
 <marker id="as" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#87A878"/></marker>
 <marker id="asr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#87A878"/></marker>
</defs>
<style>
 text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
 .hd{font-size:15px;font-weight:600}
 .sb{font-size:11.5px;fill-opacity:.9}
 .rl{font-size:12px;font-weight:600}
 .cell{font-size:14px;font-weight:600}
