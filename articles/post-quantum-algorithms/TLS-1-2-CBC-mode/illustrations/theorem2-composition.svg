<text x="20" y="650" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="bold">What the theorem asks of the setting</text>
<text x="40" y="674" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">·  the same record R* at the same index k in every session, with |R*| fixed</text>
<text x="40" y="693" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">·  k ≥ 1 and |R*| ≥ b, so a whole block lies inside the record</text>
<text x="40" y="712" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">·  the challenge ciphertext of a session is never queried back to it</text>
<text x="40" y="731" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">·  Hypothesis 1.9: the receiver handles underflow the compliant way</text>
