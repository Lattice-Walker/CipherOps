<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Lemma 3 as a chain of biconditionals from Probe returning true to the padding predicate on P star xor Delta, with the hypotheses it uses and the assumptions it does not">
<defs><marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87A878"/></marker><marker id="arr-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8A9C9"/></marker></defs>
<text x="20" y="26" fill="#87A878" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="bold">Lemma 3: Probe is exactly a padding-checking oracle</text>
<rect x="35.0" y="53" width="430" height="46" rx="8" fill="none" stroke="#87A878" stroke-width="2.5"/>
<text x="250" y="81.0" fill="#87A878" font-size="14" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle" font-weight="normal">Probe(Δ) returns true</text>
<line x1="250" y1="99" x2="250" y2="143" stroke="#87A878" stroke-width="1.5"/>
<text x="236" y="127" fill="#87A878" font-size="18" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="end" font-weight="normal">⟺</text>
<text x="272" y="122" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="bold">by definition, §1.2.3</text>
<text x="272" y="137" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">that is what Probe reports</text>
<rect x="35.0" y="143" width="430" height="46" rx="8" fill="none" stroke="#87A878" stroke-width="1.5"/>
<text x="250" y="171.0" fill="#87A878" font-size="14" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle" font-weight="normal">the reported count is 4</text>
<line x1="250" y1="189" x2="250" y2="233" stroke="#87A878" stroke-width="1.5"/>
<text x="236" y="217" fill="#87A878" font-size="18" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="end" font-weight="normal">⟺</text>
<text x="272" y="212" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="bold">Lemma 2</text>
<text x="272" y="227" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">count 4 in Case 2, count 5 in Cases 1 and 3</text>
<rect x="35.0" y="233" width="430" height="46" rx="8" fill="none" stroke="#87A878" stroke-width="1.5"/>
<text x="250" y="261.0" fill="#87A878" font-size="14" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle" font-weight="normal">Case 2 holds:  λ ≤ 55</text>
<line x1="250" y1="279" x2="250" y2="323" stroke="#87A878" stroke-width="1.5"/>
<text x="236" y="307" fill="#87A878" font-size="18" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="end" font-weight="normal">⟺</text>
<text x="272" y="302" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="bold">Lemma 1</text>
<text x="272" y="317" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">step 4 sorts every mask into exactly one case</text>
<rect x="35.0" y="323" width="430" height="46" rx="8" fill="none" stroke="#87A878" stroke-width="1.5"/>
<text x="250" y="343.0" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle" font-weight="normal">P4 ends in well-formed padding</text>
<text x="250" y="359.0" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle" font-weight="normal">of length at least two</text>
<line x1="250" y1="369" x2="250" y2="413" stroke="#87A878" stroke-width="1.5"/>
<text x="236" y="397" fill="#87A878" font-size="18" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="end" font-weight="normal">⟺</text>
<text x="272" y="392" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="bold">P4 = P* ⊕ Δ</text>
<text x="272" y="407" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">the CBC relation of §1.2.1, for any key</text>
<rect x="35.0" y="413" width="430" height="46" rx="8" fill="#B8A9C9" fill-opacity="0.35" stroke="#B8A9C9" stroke-width="2.5"/>
<text x="250" y="433.0" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle" font-weight="normal">P* ⊕ Δ ends in well-formed padding</text>
<text x="250" y="449.0" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle" font-weight="normal">of length at least two</text>
<rect x="510" y="54" width="370" height="196" rx="10" fill="none" stroke="#87A878" stroke-width="1.5"/>
<text x="524" y="78" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="bold">What the chain rests on</text>
<text x="524" y="102" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">·</text>
<text x="536" y="102" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">Lemma 2, the cost identity</text>
<text x="524" y="132" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">·</text>
<text x="536" y="132" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">the CBC relation P4 = P* ⊕ Δ</text>
<text x="524" y="162" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">·</text>
<text x="536" y="162" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">equal ciphertext length: every record has</text>
<text x="536" y="177" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">four non-IV blocks, so step 5 is reached</text>
<text x="524" y="207" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">·</text>
<text x="536" y="207" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">Hypothesis 5, compliant underflow handling</text>
<rect x="510" y="274" width="370" height="176" rx="10" fill="none" stroke="#B8A9C9" stroke-width="1.5"/>
<text x="524" y="298" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="bold">What it does not rest on</text>
<text x="524" y="322" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">·</text>
<text x="536" y="322" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">no PRP assumption on the block cipher</text>
<text x="524" y="352" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">·</text>
<text x="536" y="352" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">no SUF-CMA assumption on the MAC</text>
<text x="524" y="382" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">·</text>
<text x="536" y="382" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">no statistics, no averaging, no error term</text>
<text x="524" y="412" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">·</text>
<text x="536" y="412" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="normal">it holds for every key and every mask Δ</text>
<rect x="40" y="484" width="840" height="52" rx="10" fill="#B8A9C9" fill-opacity="0.35" stroke="#B8A9C9" stroke-width="2.5"/>
<text x="460" y="506" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle" font-weight="bold">An exact, deterministic identity: one session, one query, one bit,</text>
<text x="460" y="524" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle" font-weight="normal">and the bit is the padding predicate itself — not an approximation of it.</text>
</svg>
