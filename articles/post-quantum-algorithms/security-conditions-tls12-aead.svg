<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 528" width="900" height="528" role="img" aria-label="Conditions for a TLS 1.2 connection with AEAD cipher suites to be secure, as nested boxes in which each inner box is the stronger statement that yields the one enclosing it. Compared with TLS 1.3 the nonce is assumed unique rather than constructed for AES-GCM, the transcript binding needs the extended master secret extension, the signature covers only nonces and parameters, the limit is reached by renegotiation, and the channel key statement is available only jointly with the channel.">
<rect x="10" y="10" width="880" height="476" rx="4" fill="none" stroke="#87A878" stroke-width="1.5"/><text x="24" y="34" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">TLS 1.2 AEAD secure connection</text>
<rect x="26" y="46" width="416" height="164" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="36" y="63" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">channel key pseudorandom · only jointly with the channel</text>
<rect x="38" y="72" width="392" height="128" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="48" y="89" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">key schedule a PRF chain, bound by extended master secret</text>
<rect x="50" y="98" width="368" height="26" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="60" y="115" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">HMAC a PRF</text>
<rect x="50" y="128" width="368" height="62" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="60" y="145" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">hardness assumption on the premaster secret</text>
<rect x="62" y="154" width="344" height="26" rx="4" fill="#B8A9C9" fill-opacity="0.1" stroke="#B8A9C9" stroke-width="1.5"/>
<text x="72" y="171" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">validated shares, uniform randomness</text>
<rect x="26" y="230" width="416" height="194" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="36" y="247" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">the peer is the intended party</text>
<rect x="38" y="256" width="392" height="158" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="48" y="273" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">an accepting session has a matching partner</text>
<rect x="50" y="282" width="368" height="62" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="60" y="299" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">no forged signature · EUF-CMA over nonces and parameters</text>
<rect x="62" y="308" width="344" height="26" rx="4" fill="#B8A9C9" fill-opacity="0.1" stroke="#B8A9C9" stroke-width="1.5"/>
<text x="72" y="325" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">certificate binds the key to the identity</text>
<rect x="50" y="348" width="368" height="26" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="60" y="365" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">full handshake covered by Finished, not by the signature</text>
<rect x="50" y="378" width="368" height="26" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="60" y="395" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">no transcript collision</text>
<rect x="458" y="46" width="416" height="230" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="468" y="63" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">application data confidential and intact</text>
<rect x="470" y="72" width="392" height="194" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="480" y="89" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">indistinguishable, unforgeable, ordered</text>
<rect x="482" y="98" width="368" height="158" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="492" y="115" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">AEAD secure under the channel key with a fresh nonce</text>
<rect x="494" y="124" width="344" height="26" rx="4" fill="#B8A9C9" fill-opacity="0.1" stroke="#B8A9C9" stroke-width="1.5"/>
<text x="504" y="141" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">nonce unique · constructed ChaCha20, assumed AES-GCM</text>
<rect x="494" y="154" width="344" height="62" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="504" y="171" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">usage stays within the AEAD bound</text>
<rect x="506" y="180" width="320" height="26" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="516" y="197" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">renegotiation or new connection before the limit</text>
<rect x="494" y="220" width="344" height="26" rx="4" fill="none" stroke="#87A878" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="504" y="237" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">channel key pseudorandom</text>
<rect x="458" y="296" width="416" height="128" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="468" y="313" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">long-term compromise does not expose recorded traffic</text>
<rect x="470" y="322" width="392" height="92" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="480" y="339" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">session key independent of the long-term key</text>
<rect x="482" y="348" width="368" height="26" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="492" y="365" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">ephemeral secret erased after use</text>
<rect x="482" y="378" width="368" height="26" rx="4" fill="none" stroke="#87A878" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="492" y="395" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">channel key pseudorandom</text>
<rect x="26" y="444" width="848" height="26" rx="4" fill="#B8A9C9" fill-opacity="0.1" stroke="#B8A9C9" stroke-width="1.5"/>
<text x="36" y="461" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">no secret-dependent timing or error behaviour</text>
<rect x="26" y="502" width="20" height="13" rx="3" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="52" y="513" fill="#87A878" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">proved</text>
<rect x="112" y="502" width="20" height="13" rx="3" fill="#B8A9C9" fill-opacity="0.1" stroke="#B8A9C9" stroke-width="1.5"/>
<text x="138" y="513" fill="#B8A9C9" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">assumed</text>
<rect x="208" y="502" width="20" height="13" rx="3" fill="none" stroke="#87A878" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="234" y="513" fill="#87A878" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">needed by two chains</text>
<rect x="356" y="502" width="30" height="13" rx="3" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<rect x="368" y="505" width="14" height="7" rx="2" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="392" y="513" fill="#87A878" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">inner yields outer</text>
</svg>
