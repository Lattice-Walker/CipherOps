<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Corollary 2.49: the Lucky Thirteen adversary is IV-oblivious, so Theorem 2.47 carries it from TLS 1.1 to the TLS 1.0 hardened profile with advantage exactly 1, and Lemma 2.48 carries it to the RFC profile.">
<defs><marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87A878"/></marker><marker id="arr-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8A9C9"/></marker></defs>
<text x="20" y="28" fill="#87A878" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">Corollary 2.49: the Lucky Thirteen recovery also breaks TLS 1.0</text>
<text x="20" y="52" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">AES and HMAC-SHA-1 (b = 16, t = 20), deterministic π, receiver satisfying Hypothesis 2.35, target not the first block of its record</text>
<rect x="40" y="72" width="360" height="56" fill="#87A878" fill-opacity="0.08" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="220" y="94" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">Corollary 2.26</text>
<text x="220" y="117" fill="#87A878" font-size="15" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">𝒜<tspan dy='4' font-size='75%'>PR</tspan><tspan dy='-4'>​</tspan> against Π<tspan dy='4' font-size='75%'>1.1</tspan><tspan dy='-4'>​</tspan>[E, H, π]</text>
<rect x="40" y="196" width="360" height="56" fill="#87A878" fill-opacity="0.08" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="220" y="218" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">Theorem 2.47, hardened profile</text>
<text x="220" y="241" fill="#87A878" font-size="15" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">𝒜<tspan dy='4' font-size='75%'>PR</tspan><tspan dy='-4'>​</tspan><tspan dy='-6' font-size='75%'>↓</tspan><tspan dy='6'>​</tspan> against TLS 1.0 (h)</text>
<rect x="40" y="320" width="360" height="56" fill="#B8A9C9" fill-opacity="0.3" stroke="#B8A9C9" stroke-width="1.8" rx="4"/>
<text x="220" y="342" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">Lemma 2.48, Model A</text>
<text x="220" y="365" fill="#B8A9C9" font-size="15" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">RFC profile r</text>
<path d="M220,130 L220,194" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<circle cx="220" cy="162" r="12" fill="#87A878" fill-opacity="0.2" stroke="#87A878" stroke-width="1.5"/>
<text x="220" y="167" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">1</text>
<text x="440" y="139" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">𝒜<tspan dy='4' font-size='75%'>PR</tspan><tspan dy='-4'>​</tspan> is IV-oblivious:</text>
<text x="440" y="157" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">(i) its queries C<tspan dy='-6' font-size='75%'>att</tspan><tspan dy='6'>​</tspan>(Δ) are four blocks, IV-independent (Lemma 2.43)</text>
<text x="440" y="175" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">(ii) it reads only C<tspan dy='-6' font-size='75%'>*</tspan><tspan dy='6'>​</tspan><tspan dy='4' font-size='75%'>s</tspan><tspan dy='-4'>​</tspan> and C′<tspan dy='4' font-size='75%'>s</tspan><tspan dy='-4'>​</tspan>, both transmitted (Lemma 2.45)</text>
<text x="440" y="193" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">(iii) Probe returns [c = 4], a function of the count alone</text>
<path d="M220,254 L220,318" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<circle cx="220" cy="286" r="12" fill="#87A878" fill-opacity="0.2" stroke="#87A878" stroke-width="1.5"/>
<text x="220" y="291" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">2</text>
<text x="440" y="281" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">every hardened-profile adversary transfers (Lemma 2.48);</text>
<text x="440" y="299" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">against the RFC profile the padding alert alone already suffices</text>
<rect x="20" y="404" width="860" height="104" fill="#B8A9C9" fill-opacity="0.12" stroke="#B8A9C9" stroke-width="1.5" rx="6"/>
<text x="40" y="428" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">Against TLS 1.0</text>
<text x="40" y="452" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Model A: advantage exactly 1, no cryptographic assumption, at most M = 2<tspan dy='-6' font-size='75%'>16</tspan><tspan dy='6'>​</tspan> + 43 + 14·2<tspan dy='-6' font-size='75%'>8</tspan><tspan dy='6'>​</tspan> sessions of one query each</text>
<text x="40" y="476" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Model B: success probability ≥ 1 − δ with L ≥ (8σ<tspan dy='4' font-size='75%'>η</tspan><tspan dy='-4'>​</tspan><tspan dy='-6' font-size='75%'>2</tspan><tspan dy='6'>​</tspan>/c<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan><tspan dy='-6' font-size='75%'>2</tspan><tspan dy='6'>​</tspan>) ln(2M/δ) repetitions per mask</text>
<text x="40" y="498" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">the same session count as against TLS 1.1 and TLS 1.2 CBC mode</text>
</svg>
