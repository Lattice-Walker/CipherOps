<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Definition 2.32: TLS 1.0 decryption. After common length checks, CBC decryption from the chaining value and the padding check, the hardened profile always computes the MAC and returns one failure symbol, while the RFC profile skips the MAC on bad padding and sends a distinct alert.">
<defs><marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87A878"/></marker><marker id="arr-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8A9C9"/></marker></defs>
<text x="20" y="28" fill="#87A878" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">Definition 2.32: TLS 1.0 decryption with two receiver profiles</text>
<rect x="20" y="44" width="860" height="88" fill="#87A878" fill-opacity="0.05" stroke="#87A878" stroke-width="1.2" rx="6"/>
<text x="40" y="68" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">Common steps</text>
<text x="40" y="92" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">1  length checks on |C| alone, with n = |C|/b since there is no IV block; failure returns ⊥</text>
<text x="40" y="116" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">2  C<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan> ← ν<tspan dy='4' font-size='75%'>r</tspan><tspan dy='-4'>​</tspan>, then P<tspan dy='4' font-size='75%'>i</tspan><tspan dy='-4'>​</tspan> = D<tspan dy='4' font-size='75%'>Kₑ</tspan><tspan dy='-4'>​</tspan>(C<tspan dy='4' font-size='75%'>i</tspan><tspan dy='-4'>​</tspan>) ⊕ C<tspan dy='4' font-size='75%'>i−1</tspan><tspan dy='-4'>​</tspan>      3  ok ← Π<tspan dy='4' font-size='75%'>strict</tspan><tspan dy='-4'>​</tspan>(P)</text>
<path d="M230,134 L230,172" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<path d="M670,134 L670,172" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<text x="230" y="164" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">hardened profile h</text>
<rect x="30" y="176" width="400" height="70" fill="#87A878" fill-opacity="0.08" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="46" y="202" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">(R, T) ← Φ<tspan dy='4' font-size='75%'>1.1</tspan><tspan dy='-4'>​</tspan>(P): strip if ok, strip<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan> otherwise</text>
<text x="46" y="226" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">MAC checked on both branches, giving v</text>
<path d="M230,248 L230,270" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<rect x="50" y="272" width="160" height="36" fill="#87A878" fill-opacity="0.3" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="130.0" y="294.9" fill="#87A878" font-size="14" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">R if ok ∧ v</text>
<rect x="230" y="272" width="190" height="36" fill="#B8A9C9" fill-opacity="0.3" stroke="#B8A9C9" stroke-width="1.5" rx="4"/>
<text x="325.0" y="294.9" fill="#B8A9C9" font-size="14" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">⊥ otherwise</text>
<text x="230" y="330" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">Definition 2.9 with ν<tspan dy='4' font-size='75%'>r</tspan><tspan dy='-4'>​</tspan> in place of the IV: one failure symbol</text>
<text x="670" y="164" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">RFC profile r (RFC 2246 as written)</text>
<rect x="620" y="176" width="100" height="36" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="670.0" y="198.9" fill="#87A878" font-size="14" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">ok ?</text>
<path d="M640,212 L580,256" fill="none" stroke="#B8A9C9" stroke-width="1.5" marker-end="url(#arr-l)"/>
<text x="596" y="232" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="end">no</text>
<path d="M700,212 L770,256" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<text x="752" y="232" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">yes</text>
<rect x="480" y="258" width="190" height="36" fill="#B8A9C9" fill-opacity="0.3" stroke="#B8A9C9" stroke-width="1.5" rx="4"/>
<text x="575.0" y="280.2" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">⊥<tspan dy='4' font-size='75%'>pad</tspan><tspan dy='-4'>​</tspan>: decryption_failed</text>
<text x="575" y="312" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">no MAC computed</text>
<rect x="690" y="258" width="180" height="36" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="780.0" y="280.2" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">strip, then MAC check v</text>
<path d="M780,296 L780,330" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<rect x="690" y="332" width="85" height="34" fill="#87A878" fill-opacity="0.3" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="732.5" y="353.9" fill="#87A878" font-size="14" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">R</text>
<rect x="785" y="332" width="85" height="34" fill="#B8A9C9" fill-opacity="0.3" stroke="#B8A9C9" stroke-width="1.5" rx="4"/>
<text x="827.5" y="353.9" fill="#B8A9C9" font-size="14" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">⊥<tspan dy='4' font-size='75%'>mac</tspan><tspan dy='-4'>​</tspan></text>
<text x="870" y="384" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="end">⊥<tspan dy='4' font-size='75%'>mac</tspan><tspan dy='-4'>​</tspan>: bad_record_mac</text>
<rect x="20" y="400" width="860" height="60" fill="#87A878" fill-opacity="0.05" stroke="#87A878" stroke-width="1.2" rx="6"/>
<text x="450" y="422" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">Step 5, both profiles: sqn<tspan dy='4' font-size='75%'>r</tspan><tspan dy='-4'>​</tspan> ← sqn<tspan dy='4' font-size='75%'>r</tspan><tspan dy='-4'>​</tspan> + 1 and ν<tspan dy='4' font-size='75%'>r</tspan><tspan dy='-4'>​</tspan> ← C<tspan dy='4' font-size='75%'>n</tspan><tspan dy='-4'>​</tspan></text>
<text x="450" y="446" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">⊥<tspan dy='4' font-size='75%'>pad</tspan><tspan dy='-4'>​</tspan> ≠ ⊥<tspan dy='4' font-size='75%'>mac</tspan><tspan dy='-4'>​</tspan> is visible on the wire: the RFC profile is a padding oracle that needs no timing</text>
</svg>
