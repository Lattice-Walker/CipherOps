<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="900" height="428" role="img" aria-label="TLS 1.0 decryption. After common length checks, CBC decryption from the chaining value and the padding check, the hardened profile always computes the MAC and returns one failure symbol, while the RFC profile skips the MAC on bad padding and sends a distinct alert.">
<defs><marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87A878"/></marker><marker id="arr-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8A9C9"/></marker></defs>
<rect x="20" y="16" width="860" height="88" fill="#87A878" fill-opacity="0.05" stroke="#87A878" stroke-width="1.2" rx="6"/>
<text x="40" y="40" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">Common steps</text>
<text x="40" y="64" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">1  length checks on |C| alone, with n = |C|/b since there is no IV block; failure returns ⊥</text>
<text x="40" y="88" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">2  C<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan> ← ν<tspan dy='4' font-size='75%'>r</tspan><tspan dy='-4'>​</tspan>, then P<tspan dy='4' font-size='75%'>i</tspan><tspan dy='-4'>​</tspan> = D<tspan dy='4' font-size='75%'>Kₑ</tspan><tspan dy='-4'>​</tspan>(C<tspan dy='4' font-size='75%'>i</tspan><tspan dy='-4'>​</tspan>) ⊕ C<tspan dy='4' font-size='75%'>i−1</tspan><tspan dy='-4'>​</tspan>      3  ok ← Π<tspan dy='4' font-size='75%'>strict</tspan><tspan dy='-4'>​</tspan>(P)</text>
<path d="M230,106 L230,144" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<path d="M670,106 L670,144" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<text x="230" y="136" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">hardened profile h</text>
<rect x="30" y="148" width="400" height="70" fill="#87A878" fill-opacity="0.08" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="46" y="174" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">(R, T) ← Φ<tspan dy='4' font-size='75%'>1.1</tspan><tspan dy='-4'>​</tspan>(P): strip if ok, strip<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan> otherwise</text>
<text x="46" y="198" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">MAC checked on both branches, giving v</text>
<path d="M230,220 L230,242" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<rect x="50" y="244" width="160" height="36" fill="#87A878" fill-opacity="0.3" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="130.0" y="266.9" fill="#87A878" font-size="14" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">R if ok ∧ v</text>
<rect x="230" y="244" width="190" height="36" fill="#B8A9C9" fill-opacity="0.3" stroke="#B8A9C9" stroke-width="1.5" rx="4"/>
<text x="325.0" y="266.9" fill="#B8A9C9" font-size="14" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">⊥ otherwise</text>
<text x="670" y="136" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">RFC profile r (RFC 2246 as written)</text>
<rect x="620" y="148" width="100" height="36" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="670.0" y="170.9" fill="#87A878" font-size="14" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">ok ?</text>
<path d="M640,184 L580,228" fill="none" stroke="#B8A9C9" stroke-width="1.5" marker-end="url(#arr-l)"/>
<text x="596" y="204" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="end">no</text>
<path d="M700,184 L770,228" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<text x="752" y="204" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">yes</text>
<rect x="480" y="230" width="190" height="36" fill="#B8A9C9" fill-opacity="0.3" stroke="#B8A9C9" stroke-width="1.5" rx="4"/>
<text x="575.0" y="252.2" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">⊥<tspan dy='4' font-size='75%'>pad</tspan><tspan dy='-4'>​</tspan>: decryption_failed</text>
<text x="575" y="284" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">no MAC computed</text>
<rect x="690" y="230" width="180" height="36" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="780.0" y="252.2" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">strip, then MAC check v</text>
<path d="M780,268 L780,302" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<rect x="690" y="304" width="85" height="34" fill="#87A878" fill-opacity="0.3" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="732.5" y="325.9" fill="#87A878" font-size="14" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">R</text>
<rect x="785" y="304" width="85" height="34" fill="#B8A9C9" fill-opacity="0.3" stroke="#B8A9C9" stroke-width="1.5" rx="4"/>
<text x="827.5" y="325.9" fill="#B8A9C9" font-size="14" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">⊥<tspan dy='4' font-size='75%'>mac</tspan><tspan dy='-4'>​</tspan></text>
<text x="870" y="356" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="end">⊥<tspan dy='4' font-size='75%'>mac</tspan><tspan dy='-4'>​</tspan>: bad_record_mac</text>
<rect x="20" y="372" width="860" height="40" fill="#87A878" fill-opacity="0.05" stroke="#87A878" stroke-width="1.2" rx="6"/>
<text x="450" y="396.5" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">Step 5, both profiles: sqn<tspan dy='4' font-size='75%'>r</tspan><tspan dy='-4'>​</tspan> ← sqn<tspan dy='4' font-size='75%'>r</tspan><tspan dy='-4'>​</tspan> + 1 and ν<tspan dy='4' font-size='75%'>r</tspan><tspan dy='-4'>​</tspan> ← C<tspan dy='4' font-size='75%'>n</tspan><tspan dy='-4'>​</tspan></text>
</svg>
