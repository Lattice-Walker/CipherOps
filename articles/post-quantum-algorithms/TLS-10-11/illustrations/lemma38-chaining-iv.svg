<text x="380.0" y="203.55" fill="#87A878" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">C<tspan dy='4' font-size='75%'>2</tspan><tspan dy='-4'>​</tspan></text>
<rect x="420" y="182" width="60" height="34" fill="#87A878" fill-opacity="0.05" stroke="#87A878" stroke-width="1.5" rx="4"/>
