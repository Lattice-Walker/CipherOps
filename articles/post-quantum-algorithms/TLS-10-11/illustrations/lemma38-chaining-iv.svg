<text x="526" y="157" fill="#B8A9C9" font-size="14" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">=</text>
<text x="580" y="100" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Enc<tspan dy='-6' font-size='75%'>1</tspan><tspan dy='6'>​</tspan>(ψ<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan>(HDR), R) with HMAC-H ∘ φ<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan>,</text>
<text x="580" y="120" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">IV draw returning ν<tspan dy='4' font-size='75%'>s</tspan><tspan dy='-4'>​</tspan></text>
<text x="580" y="194" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Enc of Definition 31,</text>
<text x="580" y="214" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">chaining value ν<tspan dy='4' font-size='75%'>s</tspan><tspan dy='-4'>​</tspan> not transmitted</text>
<text x="20" y="268" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Same tag (Lemma 40), same encoding (Lemma 37), same mask ν<tspan dy='4' font-size='75%'>s</tspan><tspan dy='-4'>​</tspan> for P<tspan dy='4' font-size='75%'>1</tspan><tspan dy='-4'>​</tspan>, same chaining C<tspan dy='4' font-size='75%'>i</tspan><tspan dy='-4'>​</tspan> = E<tspan dy='4' font-size='75%'>Kₑ</tspan><tspan dy='-4'>​</tspan>(P<tspan dy='4' font-size='75%'>i</tspan><tspan dy='-4'>​</tspan> ⊕ C<tspan dy='4' font-size='75%'>i−1</tspan><tspan dy='-4'>​</tspan>):</text>
<text x="20" y="292" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">the TLS 1.0 ciphertext is the TLS 1.1 ciphertext with its IV block removed.</text>
