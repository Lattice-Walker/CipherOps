<path d="M630,110 L700,158" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<text x="160" y="142" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">⊕</text>
<rect x="180" y="160" width="160" height="34" fill="#B8A9C9" fill-opacity="0.3" stroke="#B8A9C9" stroke-width="1.5" rx="4"/>
<text x="260.0" y="181.55" fill="#B8A9C9" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">P<tspan dy='4' font-size='75%'>1</tspan><tspan dy='-4'>​</tspan>: depends on C<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan></text>
<rect x="340" y="160" width="160" height="34" fill="#87A878" fill-opacity="0.15" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="420.0" y="181.55" fill="#87A878" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">P<tspan dy='4' font-size='75%'>2</tspan><tspan dy='-4'>​</tspan></text>
<rect x="500" y="160" width="160" height="34" fill="#87A878" fill-opacity="0.15" stroke="#87A878" stroke-width="1.5" rx="4"/>
