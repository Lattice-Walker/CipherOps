<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Definition 2.42: in a four-block query only the first plaintext block depends on the chaining block; the padding run checked by the padding predicate lies in the last three blocks, so the pair ok, r is the same for every chaining block.">
<defs><marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87A878"/></marker><marker id="arr-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8A9C9"/></marker></defs>
<text x="20" y="28" fill="#87A878" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">Definition 2.42: a query whose padding check never sees the chaining block</text>
<text x="20" y="52" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Example (Lemma 2.43): a four-block query C<tspan dy='4' font-size='75%'>1</tspan><tspan dy='-4'>​</tspan> ‖ C<tspan dy='4' font-size='75%'>2</tspan><tspan dy='-4'>​</tspan> ‖ C<tspan dy='4' font-size='75%'>3</tspan><tspan dy='-4'>​</tspan> ‖ C<tspan dy='4' font-size='75%'>4</tspan><tspan dy='-4'>​</tspan>, b = 16, t = 20</text>
<rect x="40" y="76" width="100" height="34" fill="#B8A9C9" fill-opacity="0.12" stroke="#B8A9C9" stroke-width="1.5" rx="4" stroke-dasharray="4 3"/>
<text x="90.0" y="97.55" fill="#B8A9C9" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">C<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan> = any</text>
<rect x="200" y="76" width="120" height="34" fill="#87A878" fill-opacity="0.25" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="260.0" y="97.9" fill="#87A878" font-size="14" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">C<tspan dy='4' font-size='75%'>1</tspan><tspan dy='-4'>​</tspan></text>
<rect x="360" y="76" width="120" height="34" fill="#87A878" fill-opacity="0.25" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="420.0" y="97.9" fill="#87A878" font-size="14" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">C<tspan dy='4' font-size='75%'>2</tspan><tspan dy='-4'>​</tspan></text>
<rect x="520" y="76" width="120" height="34" fill="#87A878" fill-opacity="0.25" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="580.0" y="97.9" fill="#87A878" font-size="14" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">C<tspan dy='4' font-size='75%'>3</tspan><tspan dy='-4'>​</tspan></text>
<rect x="680" y="76" width="120" height="34" fill="#87A878" fill-opacity="0.25" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="740.0" y="97.9" fill="#87A878" font-size="14" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">C<tspan dy='4' font-size='75%'>4</tspan><tspan dy='-4'>​</tspan></text>
<path d="M140,110 L240,158" fill="none" stroke="#B8A9C9" stroke-width="1.5" marker-end="url(#arr-l)"/>
