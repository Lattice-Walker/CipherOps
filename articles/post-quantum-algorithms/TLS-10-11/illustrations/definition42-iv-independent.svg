<path d="M310,110 L380,158" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<path d="M580,110 L580,158" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
