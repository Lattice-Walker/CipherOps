<line x1="380" y1="206" x2="820" y2="206" stroke="#87A878" stroke-width="1.5"/>
<line x1="380" y1="200" x2="380" y2="206" stroke="#87A878" stroke-width="1.5"/>
<line x1="820" y1="200" x2="820" y2="206" stroke="#87A878" stroke-width="1.5"/>
<text x="600" y="226" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">padding run checked by Π<tspan dy='4' font-size='75%'>strict</tspan><tspan dy='-4'>​</tspan>: at most 44 bytes, all inside P<tspan dy='4' font-size='75%'>2</tspan><tspan dy='-4'>​</tspan> ‖ P<tspan dy='4' font-size='75%'>3</tspan><tspan dy='-4'>​</tspan> ‖ P<tspan dy='4' font-size='75%'>4</tspan><tspan dy='-4'>​</tspan></text>
<text x="20" y="270" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">(ok, r) is computed from P<tspan dy='4' font-size='75%'>2</tspan><tspan dy='-4'>​</tspan> ‖ P<tspan dy='4' font-size='75%'>3</tspan><tspan dy='-4'>​</tspan> ‖ P<tspan dy='4' font-size='75%'>4</tspan><tspan dy='-4'>​</tspan> and ℓ<tspan dy='4' font-size='75%'>P</tspan><tspan dy='-4'>​</tspan> only, so it is the same for every C<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan>: the query is IV-independent.</text>
<text x="20" y="294" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Only P<tspan dy='4' font-size='75%'>1</tspan><tspan dy='-4'>​</tspan>, part of the record R, changes with C<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan>; the leakage λ = h + r does not (Lemma 2.44).</text>
</svg>
