<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 306" width="900" height="306" role="img" aria-label="TLS 1.0 uses the same block ciphers, MACs and record space as TLS 1.1; only the header version bytes differ, 0x0301 instead of 0x0302.">
<defs><marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87A878"/></marker><marker id="arr-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8A9C9"/></marker></defs>
<rect x="20" y="16" width="860" height="150" fill="#87A878" fill-opacity="0.04" stroke="#87A878" stroke-width="1.2" rx="6"/>
<text x="40" y="40" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">Shared with TLS 1.1 (Definition 2.1)</text>
<path d="M46,63 L50,68 L59,57" fill="none" stroke="#87A878" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="68" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">block cipher E</text>
<text x="230" y="68" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">DES, 3DES-EDE, IDEA with b = 8; AES with b = 16 (RFC 3268)</text>
<path d="M46,89 L50,94 L59,83" fill="none" stroke="#87A878" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="94" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">MAC</text>
<text x="230" y="94" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">HMAC-MD5 (t = 16) or HMAC-SHA-1 (t = 20), tag never truncated</text>
<path d="M46,115 L50,120 L59,109" fill="none" stroke="#87A878" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="120" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">record space</text>
<text x="230" y="120" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">ℛ<tspan dy='4' font-size='75%'>1.1</tspan><tspan dy='-4'>​</tspan>: records of at most 2<tspan dy='-6' font-size='75%'>14</tspan><tspan dy='6'>​</tspan> bytes</text>
<path d="M46,141 L50,146 L59,135" fill="none" stroke="#87A878" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="146" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">MAC input</text>
<text x="230" y="146" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">AD(sqn, HDR, R) ‖ R with h = 13 (Definition 2.28)</text>
<rect x="20" y="178" width="860" height="112" fill="#B8A9C9" fill-opacity="0.06" stroke="#B8A9C9" stroke-width="1.2" rx="6"/>
<text x="40" y="202" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">The only difference: the version bytes of the header</text>
<text x="260" y="220" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">TLS 1.0 header</text>
<rect x="170" y="228" width="60" height="34" fill="#87A878" fill-opacity="0.12" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="200.0" y="249.55" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">type</text>
<rect x="230" y="228" width="60" height="34" fill="#87A878" fill-opacity="0.12" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="260.0" y="249.55" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">0x03</text>
<rect x="290" y="228" width="60" height="34" fill="#B8A9C9" fill-opacity="0.35" stroke="#B8A9C9" stroke-width="1.5" rx="4"/>
<text x="320.0" y="249.55" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">0x01</text>
<text x="640" y="220" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">TLS 1.1 header</text>
<rect x="550" y="228" width="60" height="34" fill="#87A878" fill-opacity="0.12" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="580.0" y="249.55" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">type</text>
<rect x="610" y="228" width="60" height="34" fill="#87A878" fill-opacity="0.12" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="640.0" y="249.55" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">0x03</text>
<rect x="670" y="228" width="60" height="34" fill="#B8A9C9" fill-opacity="0.35" stroke="#B8A9C9" stroke-width="1.5" rx="4"/>
<text x="700.0" y="249.55" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">0x02</text>
<text x="450" y="250" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">vs</text>
<text x="260" y="280" fill="#B8A9C9" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">ℋ<tspan dy='4' font-size='75%'>1.0</tspan><tspan dy='-4'>​</tspan> = 𝔹 × {⟨0x0301⟩<tspan dy='4' font-size='75%'>2</tspan><tspan dy='-4'>​</tspan>}</text>
<text x="640" y="280" fill="#87A878" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">ℋ<tspan dy='4' font-size='75%'>1.1</tspan><tspan dy='-4'>​</tspan> = 𝔹 × {⟨0x0302⟩<tspan dy='4' font-size='75%'>2</tspan><tspan dy='-4'>​</tspan>}</text>
</svg>
