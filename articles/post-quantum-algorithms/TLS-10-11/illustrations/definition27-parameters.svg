<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Definition 27: TLS 1.0 uses the same block ciphers, MACs and record space as TLS 1.1; only the header version bytes differ, 0x0301 instead of 0x0302.">
<defs><marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87A878"/></marker><marker id="arr-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8A9C9"/></marker></defs>
<text x="20" y="28" fill="#87A878" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">Definition 27: TLS 1.0 keeps the TLS 1.1 parameters, with version 0x0301</text>
<rect x="20" y="44" width="860" height="150" fill="#87A878" fill-opacity="0.04" stroke="#87A878" stroke-width="1.2" rx="6"/>
<text x="40" y="68" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">Shared with TLS 1.1 (Definition 1)</text>
<path d="M46,91 L50,96 L59,85" fill="none" stroke="#87A878" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="96" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">block cipher E</text>
<text x="230" y="96" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">DES, 3DES-EDE, IDEA with b = 8; AES with b = 16 (RFC 3268)</text>
<path d="M46,117 L50,122 L59,111" fill="none" stroke="#87A878" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="122" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">MAC</text>
<text x="230" y="122" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">HMAC-MD5 (t = 16) or HMAC-SHA-1 (t = 20), tag never truncated</text>
<path d="M46,143 L50,148 L59,137" fill="none" stroke="#87A878" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="148" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">record space</text>
<text x="230" y="148" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">ℛ<tspan dy='4' font-size='75%'>1.1</tspan><tspan dy='-4'>​</tspan>: records of at most 2<tspan dy='-6' font-size='75%'>14</tspan><tspan dy='6'>​</tspan> bytes</text>
<path d="M46,169 L50,174 L59,163" fill="none" stroke="#87A878" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="174" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">MAC input</text>
<text x="230" y="174" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">AD(sqn, HDR, R) ‖ R with h = 13 (Definition 28)</text>
<rect x="20" y="206" width="860" height="112" fill="#B8A9C9" fill-opacity="0.06" stroke="#B8A9C9" stroke-width="1.2" rx="6"/>
<text x="40" y="230" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">The only difference: the version bytes of the header</text>
<text x="260" y="248" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">TLS 1.0 header</text>
<rect x="170" y="256" width="60" height="34" fill="#87A878" fill-opacity="0.12" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="200.0" y="277.55" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">type</text>
<rect x="230" y="256" width="60" height="34" fill="#87A878" fill-opacity="0.12" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="260.0" y="277.55" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">0x03</text>
<rect x="290" y="256" width="60" height="34" fill="#B8A9C9" fill-opacity="0.35" stroke="#B8A9C9" stroke-width="1.5" rx="4"/>
<text x="320.0" y="277.55" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">0x01</text>
<text x="640" y="248" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">TLS 1.1 header</text>
<rect x="550" y="256" width="60" height="34" fill="#87A878" fill-opacity="0.12" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="580.0" y="277.55" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">type</text>
<rect x="610" y="256" width="60" height="34" fill="#87A878" fill-opacity="0.12" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="640.0" y="277.55" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">0x03</text>
<rect x="670" y="256" width="60" height="34" fill="#B8A9C9" fill-opacity="0.35" stroke="#B8A9C9" stroke-width="1.5" rx="4"/>
<text x="700.0" y="277.55" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">0x02</text>
<text x="450" y="278" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">vs</text>
<text x="260" y="308" fill="#B8A9C9" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">ℋ<tspan dy='4' font-size='75%'>1.0</tspan><tspan dy='-4'>​</tspan> = 𝔹 × {⟨0x0301⟩<tspan dy='4' font-size='75%'>2</tspan><tspan dy='-4'>​</tspan>}</text>
<text x="640" y="308" fill="#87A878" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">ℋ<tspan dy='4' font-size='75%'>1.1</tspan><tspan dy='-4'>​</tspan> = 𝔹 × {⟨0x0302⟩<tspan dy='4' font-size='75%'>2</tspan><tspan dy='-4'>​</tspan>}</text>
</svg>
