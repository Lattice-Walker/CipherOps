<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900" height="392" role="img" aria-label="Definition 2.46: an IV-oblivious adversary makes IV-independent queries of at least two non-IV blocks, never reads the IV block of a challenge, and decides from leakage and ciphertexts rather than verdicts.">
<defs><marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87A878"/></marker><marker id="arr-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8A9C9"/></marker></defs>
<text x="20" y="28" fill="#87A878" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">Definition 2.46: the three conditions of an IV-oblivious adversary</text>
<rect x="20" y="46" width="860" height="104" fill="#87A878" fill-opacity="0.03" stroke="#87A878" stroke-width="1.2" rx="6"/>
<circle cx="46" cy="72" r="12" fill="#87A878" fill-opacity="0.2" stroke="#87A878" stroke-width="1.5"/>
<text x="46" y="77" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">i</text>
<text x="70" y="77" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">its queries have at least two non-IV blocks and are IV-independent (Definition 2.42)</text>
<rect x="20" y="160" width="860" height="104" fill="#87A878" fill-opacity="0.03" stroke="#87A878" stroke-width="1.2" rx="6"/>
<circle cx="46" cy="186" r="12" fill="#87A878" fill-opacity="0.2" stroke="#87A878" stroke-width="1.5"/>
<text x="46" y="191" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">ii</text>
<text x="70" y="191" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">it never reads the IV block of a challenge ciphertext</text>
<rect x="20" y="274" width="860" height="104" fill="#87A878" fill-opacity="0.03" stroke="#87A878" stroke-width="1.2" rx="6"/>
<circle cx="46" cy="300" r="12" fill="#87A878" fill-opacity="0.2" stroke="#87A878" stroke-width="1.5"/>
<text x="46" y="305" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">iii</text>
<text x="70" y="305" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">its output depends on the leakage and the ciphertexts, not on the verdicts</text>
<rect x="90" y="96" width="90" height="34" fill="#B8A9C9" fill-opacity="0.1" stroke="#B8A9C9" stroke-width="1.5" rx="4" stroke-dasharray="4 3"/>
<text x="135.0" y="117.55" fill="#B8A9C9" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">C<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan>: any</text>
<rect x="180" y="96" width="60" height="34" fill="#87A878" fill-opacity="0.25" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="210.0" y="117.55" fill="#87A878" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">C<tspan dy='4' font-size='75%'>1</tspan><tspan dy='-4'>​</tspan></text>
<rect x="240" y="96" width="60" height="34" fill="#87A878" fill-opacity="0.25" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="270.0" y="117.55" fill="#87A878" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">C<tspan dy='4' font-size='75%'>2</tspan><tspan dy='-4'>​</tspan></text>
<rect x="300" y="96" width="60" height="34" fill="#87A878" fill-opacity="0.25" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="330.0" y="117.55" fill="#87A878" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">C<tspan dy='4' font-size='75%'>3</tspan><tspan dy='-4'>​</tspan></text>
<rect x="360" y="96" width="60" height="34" fill="#87A878" fill-opacity="0.25" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="390.0" y="117.55" fill="#87A878" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">C<tspan dy='4' font-size='75%'>4</tspan><tspan dy='-4'>​</tspan></text>
<text x="450" y="118" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">the answer is the same whatever the IV block is</text>
<rect x="90" y="210" width="90" height="34" fill="#B8A9C9" fill-opacity="0.05" stroke="#B8A9C9" stroke-width="1.5" rx="4" stroke-dasharray="4 3"/>
<text x="135.0" y="231.55" fill="#B8A9C9" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">C<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan></text>
<rect x="180" y="210" width="60" height="34" fill="#87A878" fill-opacity="0.25" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="210.0" y="231.55" fill="#87A878" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">C<tspan dy='4' font-size='75%'>1</tspan><tspan dy='-4'>​</tspan></text>
<rect x="240" y="210" width="60" height="34" fill="#87A878" fill-opacity="0.25" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="270.0" y="231.55" fill="#87A878" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">C<tspan dy='4' font-size='75%'>2</tspan><tspan dy='-4'>​</tspan></text>
<rect x="300" y="210" width="40" height="34" fill="#87A878" fill-opacity="0.05" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="320.0" y="231.55" fill="#87A878" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">⋯</text>
<rect x="340" y="210" width="60" height="34" fill="#87A878" fill-opacity="0.25" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="370.0" y="231.55" fill="#87A878" font-size="13" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">C<tspan dy='4' font-size='75%'>n</tspan><tspan dy='-4'>​</tspan></text>
<line x1="96" y1="214" x2="174" y2="240" stroke="#B8A9C9" stroke-width="1.5"/>
<text x="450" y="232" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">only the transmitted blocks C<tspan dy='4' font-size='75%'>1</tspan><tspan dy='-4'>​</tspan>, …, C<tspan dy='4' font-size='75%'>n</tspan><tspan dy='-4'>​</tspan> are used</text>
<rect x="90" y="324" width="120" height="34" fill="#87A878" fill-opacity="0.25" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="150.0" y="345.55" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">leakage</text>
<rect x="220" y="324" width="140" height="34" fill="#87A878" fill-opacity="0.25" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="290.0" y="345.55" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">ciphertexts</text>
<path d="M362,341 L398,341" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<rect x="400" y="324" width="60" height="34" fill="#87A878" fill-opacity="0.3" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="430.0" y="346.25" fill="#87A878" font-size="15" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">𝒜</text>
<path d="M460,341 L496,341" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<text x="504" y="346" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">output</text>
<rect x="640" y="324" width="120" height="34" fill="#B8A9C9" fill-opacity="0.08" stroke="#B8A9C9" stroke-width="1.5" rx="4" stroke-dasharray="4 3"/>
<text x="700.0" y="345.55" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">verdicts</text>
<text x="770" y="346" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">not used</text>
