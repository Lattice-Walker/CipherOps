<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="Definition 2.13: TLS 1.2 CBC mode is the scheme of §1 with its MAC replaced by a keyed family F and four corrections C0 to C3 that align it with RFC 5246.">
<defs><marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87A878"/></marker><marker id="arr-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8A9C9"/></marker></defs>
<text x="20" y="28" fill="#87A878" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">Definition 2.13: TLS 1.2 CBC mode, read against RFC 5246</text>
<text x="20" y="54" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Π<tspan dy='4' font-size='75%'>1.2</tspan><tspan dy='-4'>​</tspan>[E, F, π]: Definitions 1.7–1.8 with MAC<tspan dy='4' font-size='75%'>Kₐ</tspan><tspan dy='-4'>​</tspan> replaced by a keyed family F<tspan dy='4' font-size='75%'>Kₐ</tspan><tspan dy='-4'>​</tspan>,</text>
<text x="20" y="74" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">extra padding blocks j = (p − p<tspan dy='4' font-size='75%'>min</tspan><tspan dy='-4'>​</tspan>(R))/b for p ← π(|R|), keys as in Hypothesis 2.18, σ<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan> = (0, 0), and four corrections:</text>
<text x="263" y="108" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">as written in §1</text>
<text x="695" y="108" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">RFC 5246 reading</text>
<circle cx="46" cy="153" r="12" fill="#87A878" fill-opacity="0.2" stroke="#87A878" stroke-width="1.5"/>
<text x="46" y="158" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">C0</text>
<rect x="76" y="118" width="374" height="70" fill="#87A878" fill-opacity="0.05" stroke="#87A878" stroke-width="1.2" rx="4"/>
<rect x="510" y="118" width="370" height="70" fill="#87A878" fill-opacity="0.08" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="92" y="154" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">header space fixed at 𝔹<tspan dy='-6' font-size='75%'>5</tspan><tspan dy='6'>​</tspan>,</text>
<text x="92" y="174" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">record space fixed at 𝔹<tspan dy='-6' font-size='75%'>*</tspan><tspan dy='6'>​</tspan></text>
<text x="526" y="154" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">header space ℋ and record space ℛ ⊆ 𝔹<tspan dy='-6' font-size='75%'>*</tspan><tspan dy='6'>​</tspan></text>
<text x="526" y="174" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">become parameters of the scheme</text>
<text x="870" y="135" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="end">bookkeeping</text>
<path d="M452,153 L506,153" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<circle cx="46" cy="233" r="12" fill="#87A878" fill-opacity="0.2" stroke="#87A878" stroke-width="1.5"/>
<text x="46" y="238" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">C1</text>
<rect x="76" y="198" width="374" height="70" fill="#87A878" fill-opacity="0.05" stroke="#87A878" stroke-width="1.2" rx="4"/>
<rect x="510" y="198" width="370" height="70" fill="#87A878" fill-opacity="0.08" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="92" y="234" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">MAC over ⟨sqn⟩<tspan dy='4' font-size='75%'>8</tspan><tspan dy='-4'>​</tspan> ‖ HDR ‖ R, with a 5-byte</text>
<text x="92" y="254" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">header that must already hold |R|</text>
<text x="526" y="234" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">ℋ<tspan dy='4' font-size='75%'>1.2</tspan><tspan dy='-4'>​</tspan> = 𝔹 × {0x0303}, ℛ = ℛ<tspan dy='4' font-size='75%'>1.1</tspan><tspan dy='-4'>​</tspan>,</text>
<text x="526" y="254" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">MAC over AD ‖ R, ⟨r⟩<tspan dy='4' font-size='75%'>2</tspan><tspan dy='-4'>​</tspan> formed after depadding</text>
<text x="870" y="215" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="end">bookkeeping</text>
<path d="M452,233 L506,233" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<circle cx="46" cy="313" r="12" fill="#87A878" fill-opacity="0.2" stroke="#87A878" stroke-width="1.5"/>
<text x="46" y="318" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">C2</text>
<rect x="76" y="278" width="374" height="70" fill="#87A878" fill-opacity="0.05" stroke="#87A878" stroke-width="1.2" rx="4"/>
<rect x="510" y="278" width="370" height="70" fill="#87A878" fill-opacity="0.08" stroke="#87A878" stroke-width="1.5" rx="4"/>
<text x="92" y="314" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">step 1 rejects a bad block multiple,</text>
<text x="92" y="334" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">n &lt; 1 or nb &lt; t + 1</text>
<text x="526" y="314" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">step 1 also rejects</text>
<text x="526" y="334" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">|C| &gt; 2<tspan dy='-6' font-size='75%'>14</tspan><tspan dy='6'>​</tspan> + 2048</text>
<text x="870" y="295" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="end">bookkeeping</text>
<path d="M452,313 L506,313" fill="none" stroke="#87A878" stroke-width="1.5" marker-end="url(#arr-s)"/>
<circle cx="46" cy="393" r="12" fill="#B8A9C9" fill-opacity="0.2" stroke="#B8A9C9" stroke-width="1.5"/>
<text x="46" y="398" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">C3</text>
<rect x="76" y="358" width="374" height="70" fill="#87A878" fill-opacity="0.05" stroke="#87A878" stroke-width="1.2" rx="4"/>
<rect x="510" y="358" width="370" height="70" fill="#B8A9C9" fill-opacity="0.14" stroke="#B8A9C9" stroke-width="1.5" rx="4"/>
<text x="92" y="394" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">step 7 returns R whenever the MAC verifies,</text>
<text x="92" y="414" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">even if the padding check wf failed</text>
<text x="526" y="394" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">step 7 returns R only if wf ∧ v,</text>
<text x="526" y="414" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">and ⊥ otherwise</text>
<text x="870" y="375" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="end">substantive</text>
<path d="M452,393 L506,393" fill="none" stroke="#B8A9C9" stroke-width="1.5" marker-end="url(#arr-l)"/>
<text x="20" y="460" fill="#B8A9C9" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Without C3, dropping an all-padding final block makes the receiver return M<tspan dy='4' font-size='75%'>d</tspan><tspan dy='-4'>​</tspan> in the clear (Remark on the corrections).</text>
<text x="20" y="482" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">The TLS 1.2 scheme with its standard MAC is Π<tspan dy='4' font-size='75%'>1.2</tspan><tspan dy='-4'>​</tspan>[E, HMAC-H, π].</text>
</svg>
