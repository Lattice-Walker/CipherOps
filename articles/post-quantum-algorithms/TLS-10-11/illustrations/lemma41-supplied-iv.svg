<text x="20" y="270" fill="#87A878" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Admitted lengths agree when |C| ≤ 2<tspan dy='-6' font-size='75%'>14</tspan><tspan dy='6'>​</tspan> + 2048 − b, since ν<tspan dy='4' font-size='75%'>r</tspan><tspan dy='-4'>​</tspan> ‖ C is one block longer than C; step 2 sets C<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan> = ν<tspan dy='4' font-size='75%'>r</tspan><tspan dy='-4'>​</tspan>.</text>
<text x="20" y="294" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">The MAC values agree by Lemma 40. Definition 32 also sets ν<tspan dy='4' font-size='75%'>r</tspan><tspan dy='-4'>​</tspan> ← C<tspan dy='4' font-size='75%'>n</tspan><tspan dy='-4'>​</tspan>, but nothing reads it afterwards (one query per session).</text>
