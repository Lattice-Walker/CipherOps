<text x="20" y="530" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">In all three, C₀ is uniform on 𝔹ᵇ and independent of the key, the state and earlier ciphertexts, because R′ is fresh</text>
<text x="20" y="550" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">and the block cipher is a permutation. The ciphertexts are identically distributed (Proposition 7), so ρ can be dropped from the state.</text>
