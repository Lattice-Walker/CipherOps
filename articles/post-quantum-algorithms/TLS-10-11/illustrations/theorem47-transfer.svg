<path d="M780,102 L780,144 L80,144 L80,102" fill="none" stroke="#B8A9C9" stroke-width="1.5" marker-end="url(#arr-l)"/>
<text x="430" y="164" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">answer: count (and verdict), headers back through ψ<tspan dy='4' font-size='75%'>0</tspan><tspan dy='-4'>​</tspan><tspan dy='-6' font-size='75%'>−1</tspan><tspan dy='6'>​</tspan></text>
<rect x="20" y="190" width="860" height="54" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5" rx="6"/>
<text x="450" y="223" fill="#87A878" font-size="17" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">Adv<tspan dy='-6' font-size='75%'>G</tspan><tspan dy='6'>​</tspan><tspan dy='4' font-size='75%'>TLS 1.0, h</tspan><tspan dy='-4'>​</tspan>(𝒜<tspan dy='-6' font-size='75%'>↓</tspan><tspan dy='6'>​</tspan>, q) = Adv<tspan dy='-6' font-size='75%'>G</tspan><tspan dy='6'>​</tspan><tspan dy='4' font-size='75%'>TLS 1.1</tspan><tspan dy='-4'>​</tspan>(𝒜, q)</text>
