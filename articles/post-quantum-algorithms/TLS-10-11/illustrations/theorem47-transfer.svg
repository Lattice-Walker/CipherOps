<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="The wrapper runs the TLS 1.1 adversary, deletes the IV block from each query and translates headers; the TLS 1.0 receiver uses its chaining value in place of the IV, and the answers match, so the advantage is the same.">
