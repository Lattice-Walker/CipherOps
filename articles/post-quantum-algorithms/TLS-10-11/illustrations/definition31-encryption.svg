<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900" height="392" role="img" aria-label="Definition 31: TLS 1.0 encryption chains the first block from the chaining value, the last ciphertext block of the previous record, which is not transmitted; the last block of this record becomes the mask of the next one.">
