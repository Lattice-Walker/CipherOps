<text x="596" y="372" fill="#87A878" font-size="12" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">HMAC ∘ φ</text>
<rect x="648" y="334" width="92" height="48" fill="#87A878" fill-opacity="0.14" stroke="#87A878" stroke-width="1.2" rx="4"/>
