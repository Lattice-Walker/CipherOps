<text x="792" y="372" fill="#87A878" font-size="12" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">HMAC ∘ φ</text>
<text x="256" y="402" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">already random</text>
<text x="498" y="402" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">challenge</text>
<text x="648" y="402" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">real HMAC key</text>
<text x="20" y="444" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">PR games: the win probability moves by at most qε + 0 + qε, so the advantages differ by at most 2qε.</text>
<text x="20" y="468" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">IND games (q = 1): the advantage |2 Pr[win] − 1| moves by twice the win gap, so by at most 4ε.</text>
</svg>
