<rect x="158" y="334" width="92" height="48" fill="#B8A9C9" fill-opacity="0.14" stroke="#B8A9C9" stroke-width="1.2" rx="4"/>
<text x="204" y="352" fill="#B8A9C9" font-size="12" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">2</text>
<text x="204" y="372" fill="#B8A9C9" font-size="12" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">ρ ∘ φ</text>
