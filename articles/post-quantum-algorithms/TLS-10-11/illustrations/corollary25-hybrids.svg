<text x="20" y="284" fill="#B8A9C9" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">ρ: a fresh uniformly random function D → 𝔹<tspan dy='-6' font-size='75%'>t</tspan><tspan dy='6'>​</tspan> per session, D = all strings of length ≤ 13 + 2<tspan dy='-6' font-size='75%'>14</tspan><tspan dy='6'>​</tspan> + 2048</text>
