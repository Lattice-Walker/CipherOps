<text x="780" y="194" fill="#87A878" font-size="14" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">F = HMAC-H</text>
<text x="230" y="238" fill="#87A878" font-size="16" font-family="STIX Two Math, Latin Modern Math, Cambria Math, Times New Roman, serif" font-style="italic" text-anchor="middle">≤ qε</text>
