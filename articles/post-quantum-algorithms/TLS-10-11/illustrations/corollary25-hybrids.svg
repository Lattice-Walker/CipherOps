<path d="M120,92 L120,138" fill="none" stroke="#87A878" stroke-width="1.5" marker-start="url(#arr-s)" marker-end="url(#arr-s)"/>
<text x="130" y="120" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Theorem 2.24 (exact, under ψ)</text>
