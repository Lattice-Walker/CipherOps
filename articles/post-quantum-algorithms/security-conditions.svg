<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" role="img" aria-label="Conditions for a TLS connection to be secure, applying to TLS 1.2 with AEAD cipher suites and to TLS 1.3, as nested boxes in which each inner box is the stronger statement that yields the one enclosing it. Rings tagged 1.2 or 1.3 hold for that version only. One statement, that the channel key is pseudorandom, is needed by two chains at once, so it is drawn in full in its own chain and dashed in each chain that ends in it.">
<rect x="10" y="10" width="880" height="536" rx="4" fill="none" stroke="#87A878" stroke-width="1.5"/><text x="24" y="34" fill="#87A878" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="bold" text-anchor="start">TLS secure connection</text>
<rect x="26" y="46" width="416" height="164" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="36" y="63" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">channel key pseudorandom</text>
<rect x="38" y="72" width="392" height="128" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="48" y="89" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">key schedule a PRF chain, transcript bound · 1.2 EMS</text>
<rect x="50" y="98" width="368" height="26" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="60" y="115" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">HMAC a PRF · 1.3 also a dual PRF</text>
<rect x="50" y="128" width="368" height="62" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="60" y="145" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">hardness assumption on the shared secret</text>
<rect x="62" y="154" width="344" height="26" rx="4" fill="#B8A9C9" fill-opacity="0.1" stroke="#B8A9C9" stroke-width="1.5"/>
<text x="72" y="171" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">validated shares, uniform randomness</text>
<rect x="26" y="230" width="416" height="194" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="36" y="247" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">the peer is the intended party</text>
<rect x="38" y="256" width="392" height="158" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="48" y="273" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">an accepting session has a matching partner</text>
<rect x="50" y="282" width="368" height="62" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="60" y="299" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">no forged signature · EUF-CMA</text>
<rect x="62" y="308" width="344" height="26" rx="4" fill="#B8A9C9" fill-opacity="0.1" stroke="#B8A9C9" stroke-width="1.5"/>
<text x="72" y="325" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">certificate binds the key to the identity</text>
<rect x="50" y="348" width="368" height="26" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="60" y="365" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">full handshake covered · 1.3 signature, 1.2 Finished</text>
<rect x="50" y="378" width="368" height="26" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="60" y="395" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">no transcript collision</text>
<rect x="458" y="46" width="416" height="290" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="468" y="63" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">application data confidential and intact</text>
<rect x="470" y="72" width="392" height="254" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="480" y="89" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">indistinguishable, unforgeable, ordered</text>
<rect x="482" y="98" width="368" height="218" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="492" y="115" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">AEAD secure under the channel key with a fresh nonce</text>
<rect x="494" y="124" width="344" height="26" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="504" y="141" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">nonce from the sequence number · 1.3, 1.2 ChaCha20</text>
<rect x="494" y="154" width="344" height="26" rx="4" fill="#B8A9C9" fill-opacity="0.1" stroke="#B8A9C9" stroke-width="1.5"/>
<text x="504" y="171" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">nonce uniqueness assumed · 1.2 AES-GCM</text>
<rect x="494" y="184" width="344" height="92" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="504" y="201" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">usage stays within the AEAD bound</text>
<rect x="506" y="210" width="320" height="26" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="516" y="227" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">key update before the limit · 1.3</text>
<rect x="506" y="240" width="320" height="26" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="516" y="257" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">renegotiation or new connection · 1.2</text>
<rect x="494" y="280" width="344" height="26" rx="4" fill="none" stroke="#87A878" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="504" y="297" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">channel key pseudorandom</text>
<rect x="458" y="356" width="416" height="128" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="468" y="373" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">long-term compromise does not expose recorded traffic</text>
<rect x="470" y="382" width="392" height="92" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="480" y="399" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">session key independent of the long-term key</text>
<rect x="482" y="408" width="368" height="26" rx="4" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="492" y="425" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">ephemeral secret erased after use</text>
<rect x="482" y="438" width="368" height="26" rx="4" fill="none" stroke="#87A878" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="492" y="455" fill="#87A878" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">channel key pseudorandom</text>
<rect x="26" y="504" width="848" height="26" rx="4" fill="#B8A9C9" fill-opacity="0.1" stroke="#B8A9C9" stroke-width="1.5"/>
<text x="36" y="521" fill="#B8A9C9" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">no secret-dependent timing or error behaviour</text>
<rect x="26" y="562" width="20" height="13" rx="3" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="52" y="573" fill="#87A878" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">proved</text>
<rect x="112" y="562" width="20" height="13" rx="3" fill="#B8A9C9" fill-opacity="0.1" stroke="#B8A9C9" stroke-width="1.5"/>
<text x="138" y="573" fill="#B8A9C9" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">assumed</text>
<rect x="208" y="562" width="20" height="13" rx="3" fill="none" stroke="#87A878" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="234" y="573" fill="#87A878" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">needed by two chains</text>
<rect x="356" y="562" width="30" height="13" rx="3" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<rect x="368" y="565" width="14" height="7" rx="2" fill="#87A878" fill-opacity="0.1" stroke="#87A878" stroke-width="1.5"/>
<text x="392" y="573" fill="#87A878" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">inner yields outer</text>
<text x="508" y="573" fill="#87A878" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">· 1.2  · 1.3</text>
<text x="574" y="573" fill="#87A878" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">version-specific</text>
</svg>
